# Local-only TLS edge for the Stage 6 caller-path probe. It is deliberately
# separate from the production static-web image: production keeps /api fail-
# closed until the organizer supplies its own edge route.
log_format stage6_private 'surface=edge status=$status bytes=$body_bytes_sent method=$request_method rt=$request_time';
error_log /dev/stderr crit;

server {
  listen 3443 ssl;
  server_name localhost 127.0.0.1;
  access_log /dev/stdout stage6_private;

  ssl_certificate /etc/nginx/certs/stage6-local.crt;
  ssl_certificate_key /etc/nginx/certs/stage6-local.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cache-Control "no-store" always;

  location ^~ /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Referer $http_referer;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
  }
}
