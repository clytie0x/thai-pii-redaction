server {
  listen 8000;

  # One line per request on stdout, so the contract test can prove a denied
  # path never reached this container by counting `docker logs` lines rather
  # than trusting the status code the proxy returned.
  access_log /dev/stdout;

  location / {
    default_type application/json;
    if ($http_x_contract_failure = "413") { return 413 'UNSAFE-UPSTREAM-BODY'; }
    if ($http_x_contract_failure = "429") { return 429 'UNSAFE-UPSTREAM-BODY'; }
    if ($http_x_contract_failure = "502") { return 502 'UNSAFE-UPSTREAM-BODY'; }
    if ($http_x_contract_failure = "504") { return 504 'UNSAFE-UPSTREAM-BODY'; }
    # $uri is what this service actually received — the assertion for "the
    # /api prefix was re-added". The other fields pin internal header
    # injection without returning their values anywhere outside this test.
    return 200 '{"path":"$uri","key":"$http_x_aiguard_key","contract":"$http_x_aiguard_contract_version"}';
  }
}
