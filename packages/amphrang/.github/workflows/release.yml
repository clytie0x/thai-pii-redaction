name: release

# Tag `vX.Y.Z` on a commit whose VERSION is X.Y.Z and whose CHANGELOG.md has a
# dated `## [X.Y.Z] - YYYY-MM-DD` section. The gate refuses anything else
# before a wheel is built; the wheel goes to PyPI via trusted publishing
# (no API token in secrets — configure the publisher once on pypi.org:
# project `amphrang`, owner `Teerapat-Vatpitak`, repo `amphrang`, workflow
# `release.yml`, environment `pypi`), and a GitHub Release carries the same
# sdist + wheel with the CHANGELOG section as its body.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python scripts/check_release.py --expect-tag "$GITHUB_REF_NAME"

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      # The built wheel, not the source tree, is what gets smoke-tested: a
      # packaging omission shows up here and nowhere in the source-tree test
      # suite.
      - name: Smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'EOF'
          import amphrang
          assert amphrang.__version__ == open("VERSION").read().strip(), amphrang.__version__
          print("wheel ok", amphrang.__version__)
          EOF
      - run: python scripts/check_release.py --expect-tag "$GITHUB_REF_NAME" --notes > dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/amphrang/
    permissions:
      id-token: write # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - run: rm -f dist/RELEASE_NOTES.md
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "amphrang ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.whl dist/*.tar.gz
