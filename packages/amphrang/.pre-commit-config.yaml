# Fast local checks before each commit:  pip install pre-commit && pre-commit install
# Same ruff config as CI (pyproject [tool.ruff]); a green hook means a green lint job.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$ # markdown uses trailing spaces for hard breaks
      - id: end-of-file-fixer
        exclude: ^benchmark/data/ # byte-exact blind/lock files, see .gitattributes
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024] # gov-form probe PDFs are ~900 KB
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^benchmark/data/
