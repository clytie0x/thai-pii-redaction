[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thaiguard"
description = "Thai PII detection and redaction — mask personal data before it reaches an external AI, restore it locally"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Teerapat Vatpitak" }]
keywords = ["pii", "redaction", "thai", "pdpa", "privacy", "ner", "anonymization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: Thai",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
]
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
thaiguard = "thaiguard.cli:main"
thaiguard-mcp = "thaiguard.mcp:main"

[project.urls]
Homepage = "https://github.com/Teerapat-Vatpitak/thaiguard"
Issues = "https://github.com/Teerapat-Vatpitak/thaiguard/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }
dependencies = { file = "requirements.txt" }
optional-dependencies.server = { file = "requirements-web.txt" }
optional-dependencies.mcp = { file = "requirements-mcp.txt" }
optional-dependencies.ml = { file = "requirements-ml.txt" }
optional-dependencies.ocr = { file = "requirements-ocr.txt" }

[tool.setuptools]
# `thaiguard`'s top-level module (thaiguard/__init__.py, cli.py, mcp.py,
# serve.py) is the public facade and the only import surface with a semver
# contract. `thaiguard.engine` and `thaiguard.server` ship the internal
# engine and the optional local HTTP server; they carry no cross-release
# stability promise. Everything lives under the `thaiguard` distribution
# name so nothing installs a generic top-level import name (`app`,
# `pii_redactor`) that could collide with an unrelated package.
packages = [
  "thaiguard",
  "thaiguard.engine",
  "thaiguard.engine.detectors",
  "thaiguard.engine.anonymizer",
  "thaiguard.engine.guard",
  "thaiguard.engine.ingest",
  "thaiguard.server",
  "thaiguard.server.worker",
]

# The Thai font travels with the package: a `pip install` user renders the
# PDPA report and the processing receipt too, and without it Thai comes out
# as black boxes wherever the machine has no Thai-capable TTF of its own.
[tool.setuptools.package-data]
"thaiguard.engine" = ["fonts/*.ttf"]
"thaiguard.server" = ["demo/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
  "E501",
  "B008",
  "RUF001",
  "RUF002",
  "RUF003",
  # deferred, not endorsed — inherited from the source tree; tighten one at a time
  "B904",
  "B905",
  "B007",
  "RUF005",
  "RUF007",
  "RUF013",
  "RUF059",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E402", "F401", "F841", "RUF043"]
"thaiguard/server/server.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
