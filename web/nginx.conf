# Static page only — no proxying, no secrets. API calls go same-origin
# through the platform proxy (/api/...) to the `api` service.
log_format private 'surface=web status=$status bytes=$body_bytes_sent method=$request_method rt=$request_time';

server {
  listen 3000;
  server_name team08.aiforthai.in.th;

  # Request-level nginx diagnostics can include the full URI. Startup/fatal
  # diagnostics remain, while request details stay out of Docker/Dozzle.
  error_log /dev/stderr crit;
  # Dozzle can display this log. Never record any request target.
  access_log /var/log/nginx/access.log private;

  # The organizer terminates TLS before this container and forwards the
  # original scheme.  A plaintext request must never receive the application
  # or an access-code form.  The fixed host prevents an open redirect; $uri
  # deliberately excludes query values.
  if ($http_x_forwarded_proto = "http") {
    return 308 https://team08.aiforthai.in.th$uri;
  }
  if ($host !~ "^(team08\.aiforthai\.in\.th|localhost|127\.0\.0\.1)$") {
    return 400;
  }

  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cache-Control "no-store" always;

  root /usr/share/nginx/html;
  index index.html;

  # The platform routes /api to the API service. If that routing is missing,
  # fail visibly instead of returning the SPA with a misleading HTTP 200.
  location ^~ /api/ {
    return 404;
  }

  location = / {
    limit_except GET { deny all; }
    try_files /index.html =404;
  }

  location = /index.html {
    limit_except GET { deny all; }
    try_files /index.html =404;
  }

  location = /app {
    limit_except GET { deny all; }
    try_files /app.html =404;
  }

  location = /privacy {
    limit_except GET { deny all; }
    try_files /privacy.html =404;
  }

  location = /terms {
    limit_except GET { deny all; }
    try_files /terms.html =404;
  }

  location = /help {
    limit_except GET { deny all; }
    try_files /help.html =404;
  }

  location = /downloads {
    limit_except GET { deny all; }
    try_files /downloads.html =404;
  }

  location = /product.css {
    limit_except GET { deny all; }
    try_files /product.css =404;
  }

  location = /home.css {
    limit_except GET { deny all; }
    try_files /home.css =404;
  }

  location = /home.js {
    limit_except GET { deny all; }
    default_type application/javascript;
    try_files /home.js =404;
  }

  location = /app.css {
    limit_except GET { deny all; }
    try_files /app.css =404;
  }

  location = /app.js {
    limit_except GET { deny all; }
    default_type application/javascript;
    try_files /app.js =404;
  }

  location = /assets/ai-guard-mark.svg {
    limit_except GET { deny all; }
    default_type image/svg+xml;
    try_files /assets/ai-guard-mark.svg =404;
  }

  location = /assets/ai-guard-mark-one-color.svg {
    limit_except GET { deny all; }
    default_type image/svg+xml;
    try_files /assets/ai-guard-mark-one-color.svg =404;
  }

  location = /assets/ai-guard-mark-inverse.svg {
    limit_except GET { deny all; }
    default_type image/svg+xml;
    try_files /assets/ai-guard-mark-inverse.svg =404;
  }

  location = /assets/ai-guard-favicon.svg {
    limit_except GET { deny all; }
    default_type image/svg+xml;
    try_files /assets/ai-guard-favicon.svg =404;
  }

  location = /assets/ai-guard-favicon-inverse.svg {
    limit_except GET { deny all; }
    default_type image/svg+xml;
    try_files /assets/ai-guard-favicon-inverse.svg =404;
  }

  location = /assets/fonts/anuphan-thai.woff2 {
    limit_except GET { deny all; }
    default_type font/woff2;
    try_files /assets/fonts/anuphan-thai.woff2 =404;
  }

  location = /assets/fonts/anuphan-latin.woff2 {
    limit_except GET { deny all; }
    default_type font/woff2;
    try_files /assets/fonts/anuphan-latin.woff2 =404;
  }

  location = /assets/fonts/OFL-Anuphan.txt {
    limit_except GET { deny all; }
    default_type text/plain;
    try_files /assets/fonts/OFL-Anuphan.txt =404;
  }

  location = /robots.txt {
    limit_except GET { deny all; }
    try_files /robots.txt =404;
  }

  location = /sitemap.xml {
    limit_except GET { deny all; }
    try_files /sitemap.xml =404;
  }

  # A filename-like request is an asset/source request, never a human page.
  # Exact public files are allowlisted above; every other extension stays a
  # fixed, unbranded 404 so source filenames and near-matches cannot leak.
  location ~ \.([^/]+)$ {
    return 404;
  }

  # Exact static routes above are the entire asset allowlist. Misspelled or
  # unreviewed asset paths stay fixed, unbranded 404 responses.
  location ^~ /assets/ {
    return 404;
  }

  # Human-facing unknown GET/HEAD routes receive the branded document while
  # preserving a 404 status. Direct access to the document is never public.
  location = /404.html {
    internal;
  }

  location / {
    limit_except GET { deny all; }
    error_page 404 =404 /404.html;
    return 404;
  }
}
