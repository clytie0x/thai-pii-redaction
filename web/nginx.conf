# Static page only — no proxying, no secrets. API calls go same-origin
# through the platform proxy (/api/...) to the `api` service.
log_format private '$remote_addr $status $body_bytes_sent "$request_method"';

server {
  listen 3000;
  server_name team08.aiforthai.in.th;

  # Request-level nginx diagnostics can include the full URI. Startup/fatal
  # diagnostics remain, while request details stay out of Docker/Dozzle.
  error_log /dev/stderr crit;
  # Dozzle can display this log. Never record any request target.
  access_log /var/log/nginx/access.log private;

  root /usr/share/nginx/html;
  index index.html;

  # The platform routes /api to the API service. If that routing is missing,
  # fail visibly instead of returning the SPA with a misleading HTTP 200.
  location ^~ /api/ {
    return 404;
  }

  location / {
    try_files $uri /index.html;
  }
}
