name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      # VERSION is semver and CHANGELOG.md has its section; the tag form of
      # this gate runs in release.yml.
      - run: python scripts/check_release.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11" # requires-python floor
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install package (server + mcp extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[server,mcp]" pytest
      # The thainer model downloads on first use; retry so one upstream
      # timeout does not turn into a red pytest job.
      - run: python scripts/prewarm_ner.py
      - run: python -m pytest -q

  # A bare `pip install amphrang` must stay importable and its test suite must
  # skip — not error — wherever an extra (fastapi, mcp) is absent. The full
  # matrix above never sees that, because it installs the extras.
  test-core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - run: python scripts/prewarm_ner.py
      - run: python -c "import amphrang; print(amphrang.__version__)"
      - run: python -m pytest -q

  # The Dockerfile is the only artifact that packages [server] for a host;
  # build it, confirm the no-key start is refused, and that a keyed start
  # answers /api/health and masks a request.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t amphrang-ci .
      - name: No key -> refuses to bind
        run: |
          set +e
          out=$(docker run --rm amphrang-ci 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -ne 0
          echo "$out" | grep -q "without AMPHRANG_API_KEY"
      - name: Keyed -> health and sanitize
        run: |
          docker run -d --rm --name amphrang-ci -p 8000:8000 -e AMPHRANG_API_KEY=ci-key amphrang-ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          body=$(curl -s -X POST http://127.0.0.1:8000/api/sanitize \
            -H 'Content-Type: application/json' -H 'X-Amphrang-Contract-Version: 2' -H 'X-Amphrang-Key: ci-key' \
            --data-binary '{"text":"ผมชื่อสมชาย ใจดี เบอร์ 081-234-5678","mode":"token"}')
          echo "$body"
          echo "$body" | grep -q '"PHONE":1'
          echo "$body" | grep -q '"NAME":1'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/sanitize \
            -H 'Content-Type: application/json' -H 'X-Amphrang-Contract-Version: 2' \
            --data-binary '{"text":"x","mode":"token"}')
          test "$code" = "401"
          docker stop amphrang-ci
